title: "idea: "
labels: ["idea", "needs-scoping"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please search existing discussions first — your proposal may already be under consideration.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to accomplish? What's missing or painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change. Include example API / UI / config if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, related discussions / issues, prior art.
