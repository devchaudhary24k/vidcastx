name: 🐞 Bug Report
description: Create a bug report to help us improve
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please search existing issues before opening a new one.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `npx envinfo --system --binaries` in your project root and paste the output here. Also mention the affected workspace (e.g. apps/api, apps/app, workers/transcoder).
      render: bash
    validations:
      required: true

  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: Clear and concise description of what's happening and what you expected instead.
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Link to minimal reproduction
      description: A public repo / Stackblitz / commit that reproduces the bug. Issues without a reproduction may be closed.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, exact commands, relevant code snippets.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste any relevant logs. If from the API, include the OTel trace ID if available.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, videos, anything else useful.
