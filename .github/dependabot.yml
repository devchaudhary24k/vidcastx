# Dependency management is handled by Renovate (see .github/renovate.json),
# which targets `dev` and respects grouping/vulnerability rules. Dependabot
# version updates are disabled via `open-pull-requests-limit: 0`.
#
# Note: GitHub's Dependabot SECURITY updates are a separate toggle — turn
# them off at Repo Settings → Code security → Dependabot security updates.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
